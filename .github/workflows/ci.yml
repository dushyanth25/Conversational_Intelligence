name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.1.0

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Check Formatting
        run: |
          ruff format --check . || echo "Format warnings found. Formatting not enforced as failure."

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch wheels to keep CI runners fast and lightweight
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]

      - name: Run Test Suite
        run: |
          pytest tests/unit --cov=. --cov-report=xml --cov-report=term-missing -W ignore

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfiles/Dockerfile.dev
          push: false
          tags: conversation-intelligence-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-manifests:
    name: Validate Manifests & Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML Parser
        run: |
          python -m pip install pyyaml

      - name: Validate YAML Manifests
        run: |
          python -c '
          import os, sys, yaml
          manifest_dirs = ["workflows/argo", "deploy/kubernetes"]
          errors = 0
          for mdir in manifest_dirs:
              if not os.path.exists(mdir):
                  continue
              for root, _, files in os.walk(mdir):
                  for f in files:
                      if f.endswith((".yaml", ".yml")):
                          path = os.path.join(root, f)
                          try:
                              with open(path) as fh:
                                  list(yaml.safe_load_all(fh))
                              print(f"✓ Valid: {path}")
                          except Exception as e:
                              print(f"✗ Invalid: {path} -> {e}", file=sys.stderr)
                              errors += 1
          if errors > 0:
              sys.exit(1)
          '
