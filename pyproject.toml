[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-intelligence"
version = "0.1.0"
description = "Open-Source Conversational Intelligence Processing Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio==4.0.7",
    "groq>=0.4.0",
    "minio>=7.0.0",
    "soundfile>=0.12.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "databricks-sql-connector>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "pipeline*", "llm*", "storage*", "workflows*", "models*", "config*", "common*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=."
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
